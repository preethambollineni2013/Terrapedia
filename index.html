<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrapedia, powered by Chronos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="globe" aria-hidden="true"></div>
<div id="hint" hidden></div>
<div id="attrib">Imagery &copy; Esri, Maxar, Earthstar Geographics &middot; Globe by CesiumJS</div>
<div id="ui">
<header>
  <h1>Terrapedia</h1>
  <p class="by">Powered by Chronos</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Ask anything: capital of Japan, when did the Berlin Wall fall, India vs Brazil" autocomplete="off">
    <div id="sug"></div>
  </div>
  <nav id="chips"><button data-t="all" class="on">All</button><button data-t="country">Countries</button><button data-t="former">Former states</button><button data-t="history">History</button><button data-t="sources">Sources</button></nav>
</header>
<main id="out"></main>
<footer>
  <span class="c">&copy; 2026 Terrapedia</span>
  <span class="sep">&middot;</span>
  <span class="b">Built by Preetham</span>
</footer>
</div>
<!-- Cesium (the globe library) is loaded by globe.js, which falls back to a second CDN if the first fails -->
<script>window.onerror=function(m,s,l){document.body.insertAdjacentHTML("afterbegin","<pre style='color:#f66;background:#000;padding:8px;position:relative;z-index:99;white-space:pre-wrap'>"+m+" ("+(s||'').split('/').pop()+":"+l+")</pre>")}</script>
<script src="data.js"></script>
<script src="sources.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
<script src="live.js"></script>
<script src="earth-mode.js"></script>
<script src="globe.js"></script>
<script src="summary.js"></script>
</body>
</html>
